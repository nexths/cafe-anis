<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <title>Café Anis - Tour Virtual & Galeria</title>

    <!-- METADADOS OPEN GRAPH (Preview do Link) -->
    <meta property="og:title" content="Seu cantinho de pausa em Santa Isabel ☕" />
    <meta property="og:description" content="Salgados artesanais, doces caseiros e cafés preparados com carinho em um ambiente aconchegante." />
    <meta property="og:url" content="https://nexths.github.io/cafe-anis/" />
    <meta property="og:image" content="https://nexths.github.io/cafe-anis/assets/preview.JPG" />
    <meta property="og:type" content="website" />

    <!-- TWITTER CARD -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Seu cantinho de pausa em Santa Isabel ☕✨" />
    <meta name="twitter:description" content="Salgados artesanais, doces caseiros e cafés preparados com carinho em um ambiente aconchegante." />
    <meta name="twitter:image" content="https://nexths.github.io/cafe-anis/assets/preview.jpg" />

    <!-- SCRIPTS E ESTILOS EXTERNOS (Pannellum e Photo-Sphere) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css"/>
    <script src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@photo-sphere-viewer/core@5.1.1/index.min.css"/>
    <script src="https://cdn.jsdelivr.net/npm/three/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@photo-sphere-viewer/core@5.1.1/index.min.js"></script>

    <!-- SEU ESTILO LOCAL -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- HERO -->

    <section class="hero">

        <h1>
            Café <span>Anis</span>
        </h1>

        <p>
            Vivencie o melhor café especial
            de Santa Isabel em um ambiente acolhedor.
        </p>

        <div class="social-links">

            <a href="https://www.instagram.com/cafeaniss_"
                target="_blank">

                Instagram

            </a>

            <a href="https://maps.app.goo.gl/uoETFiui7nu99PqA6"
                target="_blank">

                Localização

            </a>

        </div>

    </section>

    <!-- GALERIA -->

    <section class="gallery-section">

        <h2>
            Nossas Especialidades
        </h2>

        <p>
            Um pedacinho do que espera por você.
        </p>

        <div id="gallery-container">

            <div class="slide active">
                <img src="./assets/cafeanis2.webp">
            </div>

            <div class="slide">
                <img src="./assets/capuccino.webp">
            </div>

            <div class="slide">
                <img src="./assets/cafedamanha.webp">
            </div>

            <div class="slide">
                <img src="./assets/ovo.webp">
            </div>

            <div class="slide">
                <img src="./assets/capuccino1.webp">
            </div>

        </div>

    </section>

    <!-- TOUR -->

    <section class="tour-section">
    <h2>Explore Nosso Espaço</h2>
    <p>Dê um giro de 360° e conheça o ambiente do Café Anis.</p>

    <div id="panorama-container">
        <div id="planet-view"></div>
        
        <div id="panorama"></div>

        <button id="fullscreenBtn" title="Tela Cheia">⛶</button>

        <div id="tour-overlay">
            <button id="playButton">▶</button>
        </div>
    </div>
</section>

    <!-- CTA -->

    <section class="cta-section">

        <a href="https://wa.me/5511998499922"
            target="_blank"
            class="btn-whatsapp">

            Fazer uma Reserva no WhatsApp

        </a>

    </section>

    <!-- JS -->

    <script src="script.js"></script>

</body>
</html>
